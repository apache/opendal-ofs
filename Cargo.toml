[package]
categories = ["filesystem"]
description = "Apache OpenDAL File System"
keywords = ["storage", "filesystem"]
name = "ofs"
version = "0.0.24"

authors = ["Apache OpenDAL <dev@opendal.apache.org>"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ofs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap.workspace = true
ofs-core = { path = "crates/core" }
opendal = { version = "0.57.0", features = ["services-fs", "services-memory", "services-s3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
members = [".", "crates/core", "crates/managed-format", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://opendal.apache.org/"
license = "Apache-2.0"
repository = "https://github.com/apache/opendal-ofs"
rust-version = "1.91.0"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4.6.5", features = ["derive", "env"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
which = { version = "8.0.5" }

[workspace.metadata.release]
pre-release-commit-message = "chore: release v{{version}}"
shared-version = true
sign-tag = true
tag-name = "v{{version}}"

[workspace.lints.rust]
unknown_lints = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints]
workspace = true
