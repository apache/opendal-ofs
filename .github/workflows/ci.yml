name: Ofs CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli

      - name: Run linters
        run: cargo x lint

      - name: Check targets
        run: cargo x check

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: cargo x test

  compliance:
    name: Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: hawkeye,cargo-deny@0.14.22

      - name: Check licenses
        run: cargo x licenses

  required:
    name: Required
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - check
      - test
      - compliance
    steps:
      - name: Guardian
        run: |
          if [[ ! ( \
                 "${{ needs.check.result }}" == "success" \
              && "${{ needs.test.result }}" == "success" \
              && "${{ needs.compliance.result }}" == "success" \
              ) ]]; then
            echo "Required jobs haven't been completed successfully."
            exit 1
          fi
