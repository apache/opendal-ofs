services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    ports:
      - "127.0.0.1:${OFS_ACCEPTANCE_MINIO_PORT:-19000}:9000"
    volumes:
      - "${OFS_ACCEPTANCE_MINIO_DATA:?OFS_ACCEPTANCE_MINIO_DATA must be set}:/data:Z"

  minio-client:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    entrypoint: mc
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
      MC_NO_COLOR: "1"
      MC_QUIET: "1"
